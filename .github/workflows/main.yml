name: Run Tests on Merge

on:
  push:
    branches:
      - main  # Solo se ejecuta cuando hay un merge a main

jobs:
  test:
    name: Run .NET Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0'  # Ajusta la versión según tu proyecto

      - name: Restore dependencies
        run: dotnet restore backend/

      - name: Build project
        run: dotnet build backend/ --no-restore --configuration Release

      - name: Run tests
        run: dotnet test backend/ --no-build --configuration Release
