on:
  push:
    branches:
      - test 

jobs:
  test:
    name: Run .NET Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v3

      - name: Restore dependencies
        run: dotnet restore BackEnd/BackEnd/

      - name: Check code formatting
        run: dotnet format --verify-no-changes || echo "⚠️ Code format issues found!"

      - name: Check for outdated dependencies
        run: dotnet list package --outdated || echo "⚠️ Some dependencies are outdated!"

      - name: Build project
        run: dotnet build BackEnd/BackEnd/ --no-restore --configuration Release

      - name: Run tests with coverage
        run: dotnet test BackEnd/Test/ --configuration Release --collect:"XPlat Code Coverage"

      - name: Upload test coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: BackEnd/Test/TestResults/

      - name: Publish project
        run: dotnet publish BackEnd/BackEnd/ --configuration Release --output ./publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-app
          path: ./publish
  frontend-tests:
    name: Run Angular Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: |
          cd front_GTIO_VotingSystem
          npm install

      - name: Run Angular tests
        run: |
          cd front_GTIO_VotingSystem
          npm test -- --no-watch --browsers=ChromeHeadless --code-coverage

      - name: Upload test coverage report (Frontend)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: front_GTIO_VotingSystem/coverage/
