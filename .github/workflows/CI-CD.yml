name: CI/CD Pipeline

on:
  push:
    branches:
      - productive
  pull_request:
    branches:
      - productive
      
jobs:
  run_backend_tests:
    name: Ejecutar el proyecto de test de backend 
    runs-on: ubuntu-latest
    steps:
    
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v3

      - name: Restore dependencies (Backend)
        run: dotnet restore BackEnd/BackEnd/

      - name: Check code formatting (Backend)
        run: dotnet format --verify-no-changes || echo "⚠️ Code format issues found!"

      - name: Check for outdated dependencies (Backend)
        run: dotnet list package --outdated || echo "⚠️ Some dependencies are outdated!"

      - name: Build project (Backend)
        run: dotnet build BackEnd/BackEnd/ --no-restore --configuration Release

      - name: Run tests with coverage (Backend)
        run: dotnet test BackEnd/Test/ --configuration Release --collect:"XPlat Code Coverage"

  run_frontend_tests:
    name: Ejecutar el conjunto de test del proyecto de angular
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
  
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
  
      - name: Install dependencies
        run: |
          cd front_GTIO_VotingSystem
          npm install
  
      - name: Run Angular tests
        run: |
          cd front_GTIO_VotingSystem
          npm test -- --no-watch --browsers=ChromeHeadless --code-coverage
  
      - name: Upload test coverage report (Frontend)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: front_GTIO_VotingSystem/coverage/

  create_ecr:
    name: Crear repositorio ECR con Terraform
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: TerraFormConfig/ECR
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        working-directory: TerraFormConfig/ECR
        run: terraform init

      - name: Check if ECR exists and import if needed
        working-directory: TerraFormConfig/ECR
        run: |
          REPO_NAME="carlos/repo"
          EXISTS=$(aws ecr describe-repositories --repository-names "$REPO_NAME" --region $AWS_REGION 2>/dev/null || true)
          if [ -n "$EXISTS" ]; then
            echo "Repository already exists. Importing into Terraform state..."
            terraform import aws_ecr_repository.carlos_repo "$REPO_NAME" || true
          else
            echo "Repository does not exist. Terraform will create it."
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESIN_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Terraform Apply
        working-directory: TerraFormConfig/ECR
        run: terraform apply -auto-approve
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESIN_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          
      - name: Capturar URI del ECR
        id: ecr_output
        working-directory: TerraFormConfig/ECR
        run: | 
          valor=$(terraform output -raw ecr_repo_url)
          echo "valor: $valor"
          echo "ECR_REPO=$valor" >> $GITHUB_OUTPUT
          echo "$(terraform output -raw ecr_repo_url)" > ecr_url.txt
          
      - name: Subir archivo como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecr-url
          path: TerraFormConfig/ECR/ecr_url.txt
        
  build_images:
    name: Construir las imagenes de nuestros productos
    runs-on: ubuntu-latest
    needs: [run_backend_tests, run_frontend_tests,create_ecr]
  
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
  
      - name: Set up Docker Compose
        run: docker compose version
  
      - name: Build only front and back services
        working-directory: DockerConfig
        run: |
          docker compose -f compose.yaml build front back kong  # Construye las imágenes front y back
  
      - name: Create images directory
        run: mkdir -p images

      - name: Save backend image
        run: docker save dockerconfig-back -o images/backend.tar
      
      - name: Save frontend image
        run: docker save dockerconfig-front -o images/frontend.tar
      
      - name: Upload both images as a single artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-images
          path: images/
          
  upload_images:
    name: Subir imágenes a ECR
    needs: build_images
    runs-on: ubuntu-latest
    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
  
      - name: Descargar artifact
        uses: actions/download-artifact@v4
        with:
            name: ecr-url
      - name: Leer URI
        run: |
            ECR_REPO=$(cat ecr_url.txt)
            echo "URI ECR: $ECR_REPO"
            echo "ECR_REPO=$ECR_REPO" >> $GITHUB_ENV
    
      - name: Login en ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REPO
          
      - name: Download built images
        uses: actions/download-artifact@v4
        with:
          name: published-images
          path: ./images

      - name: Delete existing ECR images (frontend and backend)
        run: |
          aws ecr batch-delete-image --repository-name carlos/repo --image-ids imageTag=frontend || true
          aws ecr batch-delete-image --repository-name carlos/repo --image-ids imageTag=backend || true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESIN_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
      
      - name: Load backend image
        run: docker load < ./images/backend.tar
      
      - name: Load frontend image
        run: docker load < ./images/frontend.tar

      - name: Etiquetar y subir imagen backend
        run: |
          docker tag dockerconfig-back:latest $ECR_REPO:backend
          docker push $ECR_REPO:backend

      - name: Etiquetar y subir imagen frontend
        run: |
          docker tag dockerconfig-front:latest $ECR_REPO:frontend
          docker push $ECR_REPO:frontend
          
  deploy_net_and_sec:
    name: Subir las configuraciones de red y seguridad a AWS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TerraFormConfig/NET_AND_SEC
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
  
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
  
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.5
          
      - name: Terraform Init
        run: terraform init
      
      - name: Import SQL Server in rule if exists
        run: |
          SG_ID=$(aws ec2 describe-security-groups --filters Name=vpc-id,Values=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query "Vpcs[0].VpcId" --output text) --query "SecurityGroups[?GroupName=='default'].GroupId" --output text)
          echo "Default security group id: $SG_ID"
          RULE_INFO=$(aws ec2 describe-security-group-rules --filters Name=group-id,Values=$SG_ID --query 'SecurityGroupRules' --output json | jq -r '.[] | select(.Description=="SQL Server in rule") | [.GroupId, .Type, .IpProtocol, (.FromPort // 0), (.ToPort // 0), (.CidrIpv4 // .CidrIpv6 // "0.0.0.0/0")] | @tsv' | head -1)
          if [ -z "$RULE_INFO" ]; then
            echo "No se encontró regla SQL para importar"
          else
            IMPORT_ID=$(echo $RULE_INFO | tr ' ' '_')
            echo "Importando regla SQL con ID: $IMPORT_ID"
            terraform import aws_security_group_rule.sql_in_rule $IMPORT_ID || true
          fi
  
      - name: Import Frontend in rule if exists
        run: |
          SG_ID=$(aws ec2 describe-security-groups --filters Name=vpc-id,Values=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query "Vpcs[0].VpcId" --output text) --query "SecurityGroups[?GroupName=='default'].GroupId" --output text)
          echo "Default security group id: $SG_ID"
          RULE_INFO=$(aws ec2 describe-security-group-rules --filters Name=group-id,Values=$SG_ID --query 'SecurityGroupRules' --output json | jq -r '.[] | select(.Description=="Frontend in rule") | [.GroupId, .Type, .IpProtocol, (.FromPort // 0), (.ToPort // 0), (.CidrIpv4 // .CidrIpv6 // "0.0.0.0/0")] | @tsv' | head -1)
          if [ -z "$RULE_INFO" ]; then
            echo "No se encontró regla Frontend para importar"
          else
            IMPORT_ID=$(echo $RULE_INFO | tr ' ' '_')
            echo "Importando regla Frontend con ID: $IMPORT_ID"
            terraform import aws_security_group_rule.front_in_rule $IMPORT_ID || true
          fi
  
      - name: Import Backend in rule if exists
        run: |
          SG_ID=$(aws ec2 describe-security-groups --filters Name=vpc-id,Values=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query "Vpcs[0].VpcId" --output text) --query "SecurityGroups[?GroupName=='default'].GroupId" --output text)
          echo "Default security group id: $SG_ID"
          RULE_INFO=$(aws ec2 describe-security-group-rules --filters Name=group-id,Values=$SG_ID --query 'SecurityGroupRules' --output json | jq -r '.[] | select(.Description=="backend in rule") | [.GroupId, .Type, .IpProtocol, (.FromPort // 0), (.ToPort // 0), (.CidrIpv4 // .CidrIpv6 // "0.0.0.0/0")] | @tsv' | head -1)
          if [ -z "$RULE_INFO" ]; then
            echo "No se encontró regla Backend para importar"
          else
            IMPORT_ID=$(echo $RULE_INFO | tr ' ' '_')
            echo "Importando regla Backend con ID: $IMPORT_ID"
            terraform import aws_security_group_rule.back_in_rule $IMPORT_ID || true
          fi
  
      - name: Import Kong in rule if exists
        run: |
          SG_ID=$(aws ec2 describe-security-groups --filters Name=vpc-id,Values=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query "Vpcs[0].VpcId" --output text) --query "SecurityGroups[?GroupName=='default'].GroupId" --output text)
          echo "Default security group id: $SG_ID"
          RULE_INFO=$(aws ec2 describe-security-group-rules --filters Name=group-id,Values=$SG_ID --query 'SecurityGroupRules' --output json | jq -r '.[] | select(.Description=="kong in rule") | [.GroupId, .Type, .IpProtocol, (.FromPort // 0), (.ToPort // 0), (.CidrIpv4 // .CidrIpv6 // "0.0.0.0/0")] | @tsv' | head -1)
          if [ -z "$RULE_INFO" ]; then
            echo "No se encontró regla Kong para importar"
          else
            IMPORT_ID=$(echo $RULE_INFO | tr ' ' '_')
            echo "Importando regla Kong con ID: $IMPORT_ID"
            terraform import aws_security_group_rule.kong_in_rule $IMPORT_ID || true
          fi
  
      - name: Terraform Validate
        run: terraform validate
  
      - name: Terraform Plan
        run: terraform plan -out=tfplan
  
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan


  deploy_target_group:
    name: Subir los Target Group a AWS
    needs: deploy_net_and_sec
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TerraFormConfig/TARGET_GRP

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.5

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        
  deploy_alb:
    name: Subir los balanceadores de carga a AWS
    needs: deploy_target_group
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TerraFormConfig/ALB

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.5

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
