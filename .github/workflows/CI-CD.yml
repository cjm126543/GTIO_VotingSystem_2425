name: CI/CD Pipeline

on:
  push:
    branches:
      - productive
  pull_request:
    branches:
      - productive
env:
  AWS_REGION: us-east-1
  ECR_FRONT_REPO: <tu_id_ecr>.dkr.ecr.us-east-1.amazonaws.com/front
  ECR_BACK_REPO: <tu_id_ecr>.dkr.ecr.us-east-1.amazonaws.com/back

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore
        working-directory: BackEnd/BackEnd

      - name: Format check
        run: dotnet format --verify-no-changes
        working-directory: BackEnd/BackEnd

      - name: Run tests
        run: dotnet test
        working-directory: BackEnd/Test

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install
        working-directory: front_GTIO_VotingSystem

      - name: Run tests
        run: npm run test -- --watch=false --browsers=ChromeHeadless
        working-directory: front_GTIO_VotingSystem

  build-images:
    name: Build Docker Images (Front & Back)
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: |
      github.event_name == 'push' && (
        contains(github.event.head_commit.message, '[build]') ||
        github.ref == 'refs/heads/productive'
      )
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Compose
        run: docker compose version

      - name: Build only front and back services
        working-directory: DockerConfig
        run: docker compose build front back

      - name: Save backend image as DockerFile
        run: |
          mkdir -p DockerConfig/BACK
          docker save back > DockerConfig/BACK/DockerFile

      - name: Save frontend image as DockerFile
        run: |
          mkdir -p DockerConfig/FRONT
          docker save front > DockerConfig/FRONT/DockerFile

      - name: Upload backend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: back-image
          path: DockerConfig/BACK/DockerFile

      - name: Upload frontend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: front-image
          path: DockerConfig/FRONT/DockerFile

  deploy:
    needs:
      - test-backend
      - test-frontend
      - build-images
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' && github.ref == 'refs/heads/productive' ||
      github.event_name == 'pull_request' && github.base_ref == 'productive'
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Iniciar sesión en AWS
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login a ECR para Frontend
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_FRONT_REPO

      - name: Login a ECR para Backend
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_BACK_REPO

      - name: Construir imagen FRONT y subir a ECR
        working-directory: front_GTIO_VotingSystem
        run: |
          docker build -t front . 
          docker tag front:latest $ECR_FRONT_REPO:latest
          docker push $ECR_FRONT_REPO:latest

      - name: Construir imagen BACK y subir a ECR
        working-directory: BackEnd/BackEnd
        run: |
          docker build -t back . 
          docker tag back:latest $ECR_BACK_REPO:latest
          docker push $ECR_BACK_REPO:latest

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Inicializar Terraform
        working-directory: terraform
        run: terraform init

      - name: Planificar cambios de infraestructura
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Aplicar infraestructura con Terraform
        working-directory: terraform
        run: terraform apply -auto-approve tfplan
