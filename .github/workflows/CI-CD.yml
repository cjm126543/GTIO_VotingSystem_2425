name: CI/CD Pipeline

on:
  push:
    branches:
      - productive
  pull_request:
    branches:
      - productive
env:
  AWS_REGION: us-east-1
  ECR_FRONT_REPO: 024663765236.dkr.ecr.us-east-1.amazonaws.com/front
  ECR_BACK_REPO: <tu_id_ecr>.dkr.ecr.us-east-1.amazonaws.com/back

jobs:
  run_backend_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v3

      - name: Restore dependencies (Backend)
        run: dotnet restore BackEnd/BackEnd/

      - name: Check code formatting (Backend)
        run: dotnet format --verify-no-changes || echo "⚠️ Code format issues found!"

      - name: Check for outdated dependencies (Backend)
        run: dotnet list package --outdated || echo "⚠️ Some dependencies are outdated!"

      - name: Build project (Backend)
        run: dotnet build BackEnd/BackEnd/ --no-restore --configuration Release

      - name: Run tests with coverage (Backend)
        run: dotnet test BackEnd/Test/ --configuration Release --collect:"XPlat Code Coverage"

      - name: Upload test coverage report (Backend)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-backend
          path: BackEnd/Test/TestResults/

      - name: Publish project (Backend)
        run: dotnet publish BackEnd/BackEnd/ --configuration Release --output ./publish-backend

      - name: Upload build artifact (Backend)
        uses: actions/upload-artifact@v4
        with:
          name: published-backend
          path: ./publish-backend

  # Job para ejecutar pruebas del Frontend
  run_frontend_tests:
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
  
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
  
      - name: Install dependencies
        run: |
          cd front_GTIO_VotingSystem
          npm install
  
      - name: Run Angular tests
        run: |
          cd front_GTIO_VotingSystem
          npm test -- --no-watch --browsers=ChromeHeadless --code-coverage
  
      - name: Upload test coverage report (Frontend)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: front_GTIO_VotingSystem/coverage/
        
  build-images:
    name: Build Docker Images (Front & Back)
    runs-on: ubuntu-latest
    needs: [run_backend_tests, run_frontend_tests]
    if: |
      github.event_name == 'push' && contains(github.event.head_commit.message, 'imagen')
  
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
  
      - name: Set up Docker Compose
        run: docker compose version
  
      - name: Build only front and back services
        working-directory: DockerConfig
        run: |
          docker-compose -f compose.yml build front back  # Construye las imágenes front y back
  
      - name: List Docker images
        run: docker images  # Muestra las imágenes disponibles en Docker para depuración
  
      - name: Save backend image as DockerFile
        run: |
          mkdir -p DockerConfig/BACK
          docker save back > DockerConfig/BACK/DockerFile  
  
      - name: Save frontend image as DockerFile
        run: |
          mkdir -p DockerConfig/FRONT
          docker save front > DockerConfig/FRONT/DockerFile  
  
      - name: Upload backend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: back-image
          path: DockerConfig/BACK/DockerFile
  
      - name: Upload frontend image artifact
        uses: actions/upload-artifact@v4
        with:
          name: front-image
          path: DockerConfig/FRONT/DockerFile


  deploy:
    needs:
      - run_backend_tests
      - run_frontend_tests
      - build-images
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3
      - name: Imprimir variables de entorno
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}"
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}"
          echo "AWS_REGION=${{ secrets.AWS_REGION }}"
     
          
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
          
      - name: Verificar configuración de AWS
        run: |
          aws sts get-caller-identity
          aws configure list
      - name: Login a ECR para Frontend
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_FRONT_REPO

      - name: Login a ECR para Backend
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_BACK_REPO

      - name: Construir imagen FRONT y subir a ECR
        working-directory: front_GTIO_VotingSystem
        run: |
          docker build -t front . 
          docker tag front:latest $ECR_FRONT_REPO:latest
          docker push $ECR_FRONT_REPO:latest

      - name: Construir imagen BACK y subir a ECR
        working-directory: BackEnd/BackEnd
        run: |
          docker build -t back . 
          docker tag back:latest $ECR_BACK_REPO:latest
          docker push $ECR_BACK_REPO:latest

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Inicializar Terraform
        working-directory: terraform
        run: terraform init

      - name: Planificar cambios de infraestructura
        working-directory: terraform
        run: terraform plan -out=tfplan

      - name: Aplicar infraestructura con Terraform
        working-directory: terraform
        run: terraform apply -auto-approve tfplan
