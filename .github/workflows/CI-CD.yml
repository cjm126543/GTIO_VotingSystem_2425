name: CI/CD Pipeline

on:
  push:
    branches:
      - productive
  pull_request:
    branches:
      - productive
      
jobs:
  create_ecr:
    name: Crear repositorio ECR con Terraform
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: TerraFormConfig/ECR
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Set up AWS CLI
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        working-directory: TerraFormConfig/ECR
        run: terraform init

      - name: Check if ECR exists and import if needed
        working-directory: TerraFormConfig/ECR
        run: |
          REPO_NAME="carlos/repo"
          EXISTS=$(aws ecr describe-repositories --repository-names "$REPO_NAME" --region $AWS_REGION 2>/dev/null || true)
          if [ -n "$EXISTS" ]; then
            echo "Repository already exists. Importing into Terraform state..."
            terraform import aws_ecr_repository.carlos_repo "$REPO_NAME" || true
          else
            echo "Repository does not exist. Terraform will create it."
          fi
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESIN_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}

      - name: Terraform Apply
        working-directory: TerraFormConfig/ECR
        run: terraform apply -auto-approve
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESIN_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          
      - name: Capturar URI del ECR
        id: ecr_output
        working-directory: TerraFormConfig/ECR
        run: | 
          valor=$(terraform output -raw ecr_repo_url)
          echo "valor: $valor"
          echo "ECR_REPO=$valor" >> $GITHUB_OUTPUT
          echo "$(terraform output -raw ecr_repo_url)" > ecr_url.txt
          
      - name: Subir archivo como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ecr-url
          path: TerraFormConfig/ECR/ecr_url.txt
        
  build_images:
    name: Construir las imagenes de nuestros productos
    runs-on: ubuntu-latest
    needs: create_ecr
  
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
  
      - name: Set up Docker Compose
        run: docker compose version
  
      - name: Build services
        working-directory: DockerConfig
        run: |
          docker compose -f compose.yaml build front back kong  
  
      - name: Create images directory
        run: mkdir -p images

      - name: Save backend image
        run: docker save dockerconfig-back -o images/backend.tar
      
      - name: Save frontend image
        run: docker save dockerconfig-front -o images/frontend.tar
      
      - name: Save kong image
        run: docker save dockerconfig-kong -o images/kong.tar
      
      - name: Upload both images as a single artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-images
          path: images/
          
  upload_images:
    name: Subir imágenes a ECR
    needs: build_images
    runs-on: ubuntu-latest
    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
  
      - name: Descargar artifact
        uses: actions/download-artifact@v4
        with:
            name: ecr-url
            
      - name: Leer URI
        run: |
            ECR_REPO=$(cat ecr_url.txt)
            echo "URI ECR: $ECR_REPO"
            echo "ECR_REPO=$ECR_REPO" >> $GITHUB_ENV
    
      - name: Login en ECR
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin $ECR_REPO
          
      - name: Download built images
        uses: actions/download-artifact@v4
        with:
          name: published-images
          path: ./images

      - name: Delete existing ECR images (frontend and backend)
        run: |
          aws ecr batch-delete-image --repository-name carlos/repo --image-ids imageTag=frontend || true
          aws ecr batch-delete-image --repository-name carlos/repo --image-ids imageTag=backend || true
          aws ecr batch-delete-image --repository-name carlos/repo --image-ids imageTag=kong || true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESIN_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
      
      - name: Load backend image
        run: docker load < ./images/backend.tar
      
      - name: Load frontend image
        run: docker load < ./images/frontend.tar
        
      - name: Load kong image
        run: docker load < ./images/kong.tar

      - name: Etiquetar y subir imagen backend
        run: |
          docker tag dockerconfig-back:latest $ECR_REPO:backend
          docker push $ECR_REPO:backend

      - name: Etiquetar y subir imagen frontend
        run: |
          docker tag dockerconfig-front:latest $ECR_REPO:frontend
          docker push $ECR_REPO:frontend

      - name: Etiquetar y subir imagen kong
        run: |
          docker tag dockerconfig-kong:latest $ECR_REPO:kong
          docker push $ECR_REPO:kong
          
      - name: Construir URIs de imágenes
        run: |
          echo "front_image = \"${ECR_REPO}:frontend\"" > images.tfvars
          echo "back_image  = \"${ECR_REPO}:backend\"" >> images.tfvars
          echo "kong_image  = \"${ECR_REPO}:kong\"" >> images.tfvars  
     
      - name: Show image URLs
        run: |
          echo "Frontend Image: ${ECR_REPO}:frontend"
          echo "Backend Image:  ${ECR_REPO}:backend"
          echo "Kong Image:     ${ECR_REPO}:kong"

      - name: Upload tfvars file as artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-vars
          path: images.tfvars
                
  deploy_net_and_sec:
    name: Subir las configuraciones de red y seguridad a AWS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TerraFormConfig/NET_AND_SEC
    steps:
    
      - name: Checkout code
        uses: actions/checkout@v4
  
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
  
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.5
          
      - name: Terraform Init
        run: terraform init
      
      - name: Import SQL Server in rule if exists
        run: |
          SG_ID=$(aws ec2 describe-security-groups \
              --filters Name=vpc-id,Values=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query "Vpcs[0].VpcId" --output text) \
              --query "SecurityGroups[?GroupName=='default'].GroupId" --output text)
          echo "Default security group id: $SG_ID"
      
          RULE_INFO=$(
            aws ec2 describe-security-group-rules --filters Name=group-id,Values=$SG_ID \
              --query 'SecurityGroupRules' --output json |
            jq -r '
              map(select(.Description=="SQL Server in rule"))[0] |
              [
                .GroupId,
                (if .IsEgress then "egress" else "ingress" end),
                .IpProtocol,
                (.FromPort // 0),
                (.ToPort   // 0),
                (.CidrIpv4 // .CidrIpv6 // "0.0.0.0/0")
              ] | @tsv
            '
          )
      
          if [ -z "$RULE_INFO" ]; then
            echo "No se encontró regla SQL para importar"
          else
            IMPORT_ID=$(echo "$RULE_INFO" | tr '\t' '_')
            echo "Importando regla SQL con ID: $IMPORT_ID"
            terraform import aws_security_group_rule.sql_in_rule "$IMPORT_ID" || true
          fi
      
      - name: Import Frontend in rule if exists
        run: |
          SG_ID=$(aws ec2 describe-security-groups \
              --filters Name=vpc-id,Values=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query "Vpcs[0].VpcId" --output text) \
              --query "SecurityGroups[?GroupName=='default'].GroupId" --output text)
          echo "Default security group id: $SG_ID"
      
          RULE_INFO=$(
            aws ec2 describe-security-group-rules --filters Name=group-id,Values=$SG_ID \
              --query 'SecurityGroupRules' --output json |
            jq -r '
              map(select(.Description=="Frontend in rule"))[0] |
              [
                .GroupId,
                (if .IsEgress then "egress" else "ingress" end),
                .IpProtocol,
                (.FromPort // 0),
                (.ToPort   // 0),
                (.CidrIpv4 // .CidrIpv6 // "0.0.0.0/0")
              ] | @tsv
            '
          )
      
          if [ -z "$RULE_INFO" ]; then
            echo "No se encontró regla Frontend para importar"
          else
            IMPORT_ID=$(echo "$RULE_INFO" | tr '\t' '_')
            echo "Importando regla Frontend con ID: $IMPORT_ID"
            terraform import aws_security_group_rule.front_in_rule "$IMPORT_ID" || true
          fi
      
      - name: Import Backend in rule if exists
        run: |
          SG_ID=$(aws ec2 describe-security-groups \
              --filters Name=vpc-id,Values=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query "Vpcs[0].VpcId" --output text) \
              --query "SecurityGroups[?GroupName=='default'].GroupId" --output text)
          echo "Default security group id: $SG_ID"
      
          RULE_INFO=$(
            aws ec2 describe-security-group-rules --filters Name=group-id,Values=$SG_ID \
              --query 'SecurityGroupRules' --output json |
            jq -r '
              map(select(.Description=="backend in rule"))[0] |
              [
                .GroupId,
                (if .IsEgress then "egress" else "ingress" end),
                .IpProtocol,
                (.FromPort // 0),
                (.ToPort   // 0),
                (.CidrIpv4 // .CidrIpv6 // "0.0.0.0/0")
              ] | @tsv
            '
          )
      
          if [ -z "$RULE_INFO" ]; then
            echo "No se encontró regla Backend para importar"
          else
            IMPORT_ID=$(echo "$RULE_INFO" | tr '\t' '_')
            echo "Importando regla Backend con ID: $IMPORT_ID"
            terraform import aws_security_group_rule.back_in_rule "$IMPORT_ID" || true
          fi
      
      - name: Import Kong in rule if exists
        run: |
          SG_ID=$(aws ec2 describe-security-groups \
              --filters Name=vpc-id,Values=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query "Vpcs[0].VpcId" --output text) \
              --query "SecurityGroups[?GroupName=='default'].GroupId" --output text)
          echo "Default security group id: $SG_ID"
      
          RULE_INFO=$(
            aws ec2 describe-security-group-rules --filters Name=group-id,Values=$SG_ID \
              --query 'SecurityGroupRules' --output json |
            jq -r '
              map(select(.Description=="kong in rule"))[0] |
              [
                .GroupId,
                (if .IsEgress then "egress" else "ingress" end),
                .IpProtocol,
                (.FromPort // 0),
                (.ToPort   // 0),
                (.CidrIpv4 // .CidrIpv6 // "0.0.0.0/0")
              ] | @tsv
            '
          )
      
          if [ -z "$RULE_INFO" ]; then
            echo "No se encontró regla Kong para importar"
          else
            IMPORT_ID=$(echo "$RULE_INFO" | tr '\t' '_')
            echo "Importando regla Kong con ID: $IMPORT_ID"
            terraform import aws_security_group_rule.kong_in_rule "$IMPORT_ID" || true
          fi

      - name: Import dataBase Kong rule if exist
        run: |
          SG_ID=$(aws ec2 describe-security-groups \
              --filters Name=vpc-id,Values=$(aws ec2 describe-vpcs --filters Name=isDefault,Values=true --query "Vpcs[0].VpcId" --output text) \
              --query "SecurityGroups[?GroupName=='default'].GroupId" --output text)
          echo "Default security group id: $SG_ID"
      
          RULE_INFO=$(
            aws ec2 describe-security-group-rules --filters Name=group-id,Values=$SG_ID \
              --query 'SecurityGroupRules' --output json |
            jq -r '
              map(select(.Description=="kongdb in rule"))[0] |
              [
                .GroupId,
                (if .IsEgress then "egress" else "ingress" end),
                .IpProtocol,
                (.FromPort // 0),
                (.ToPort   // 0),
                (.CidrIpv4 // .CidrIpv6 // "0.0.0.0/0")
              ] | @tsv
            '
          )
      
          if [ -z "$RULE_INFO" ]; then
            echo "No se encontró regla dataBase Kong para importar"
          else
            IMPORT_ID=$(echo "$RULE_INFO" | tr '\t' '_')
            echo "Importando regla Kong con ID: $IMPORT_ID"
            terraform import aws_security_group_rule.kongdb_in_rule "$IMPORT_ID" || true
          fi
  
      - name: Terraform Validate
        run: terraform validate
  
      - name: Terraform Plan
        run: terraform plan -out=tfplan
  
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan


  deploy_target_group:
    name: Subir los Target Group a AWS
    needs: deploy_net_and_sec
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TerraFormConfig/TARGET_GRP

    steps:
    
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.5

      - name: Terraform Init
        run: terraform init
        
      - name: Import existing Target Groups if they exist
        run: |
          TG_NAMES=("front-tgn" "kong-tgn" "back-tgn")
          MODULES=("target_group_front" "target_group_kong" "target_group_back")
      
          for i in "${!TG_NAMES[@]}"; do
            TG_NAME=${TG_NAMES[$i]}
            MOD_NAME=${MODULES[$i]}
      
            TG_ARN=$(aws elbv2 describe-target-groups --names "$TG_NAME" \
                      --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null || true)
      
            if [[ -n "$TG_ARN" && "$TG_ARN" != "None" ]]; then
              echo "Importando TG $TG_NAME en $TG_ARN"
              terraform import "module.${MOD_NAME}.aws_lb_target_group.target_group" "$TG_ARN" || true
            else
              echo "TG $TG_NAME no existe; Terraform lo creará"
            fi
          done
      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        
  deploy_alb:
    name: Subir los balanceadores de carga a AWS
    needs: deploy_target_group
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TerraFormConfig/ALB

    steps:
    
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.5

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  deploy_ecs:
    name: Desplegar ECS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TerraFormConfig/ECS   
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
  
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}
  
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.5
  
      - name: Terraform Init
        run: terraform init

      - name: Terraform Import Auto Scaling Groups
        run: |
          terraform import module.ecs_cluster_front.aws_autoscaling_group.ecs_asg ecs-asg-front || true
          terraform import module.ecs_cluster_back.aws_autoscaling_group.ecs_asg ecs-asg-back || true
          terraform import module.ecs_cluster_kong.aws_autoscaling_group.ecs_asg ecs-asg-kong || true
          terraform import module.ecs_cluster_front.aws_ecs_capacity_provider.custom_cp front-capacity-provider || true
          terraform import module.ecs_cluster_back.aws_ecs_capacity_provider.custom_cp back-capacity-provider || true
          terraform import module.ecs_cluster_kong.aws_ecs_capacity_provider.custom_cp kong-capacity-provider || true

      - name: Terraform Validate
        run: terraform validate
  
      - name: Terraform Plan
        run: terraform plan -out=tfplan
  
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        
  deploy_task_def:
    name: Desplegar definiciones de las tareas
    needs: [upload_images, deploy_ecs,deploy_alb]
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
  
      - name: Download image-vars artifact
        uses: actions/download-artifact@v4
        with:
          name: image-vars
          path: TerraFormConfig/TASK_DEFS     
  
      - name: Show contents of tfvars (opcional)
        run: cat TerraFormConfig/TASK_DEFS/images.tfvars
  
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
            aws-region: ${{ secrets.AWS_REGION }}
          
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
            terraform_version: 1.6.5
            
      - name: Get LabRole ARN
        id: labrole
        shell: bash
        run: |
          ROLE_NAME="LabRole"     
      
          LABROLE_ARN=$(aws iam get-role \
              --role-name "${ROLE_NAME}" \
              --query 'Role.Arn' \
              --output text 2>/dev/null || true)
      
          if [[ -z "${LABROLE_ARN}" || "${LABROLE_ARN}" == "None" ]]; then
            echo "ERROR: El role '${ROLE_NAME}' no existe o no es accesible."
            exit 1
          fi
      
          echo "labrole_arn=${LABROLE_ARN}" >> "$GITHUB_OUTPUT"
      
      - name: Generate labrole.auto.tfvars
        shell: bash
        working-directory: TerraFormConfig/TASK_DEFS
        run: |
          cat > labrole.auto.tfvars <<EOF
          labrole_arn = "${{ steps.labrole.outputs.labrole_arn }}"
          EOF
      
          echo "labrole.auto.tfvars creado con:"
          cat labrole.auto.tfvars
          
      - name: Terraform Init
        working-directory: TerraFormConfig/TASK_DEFS
        run: terraform init
  
      - name: Terraform Validate
        working-directory: TerraFormConfig/TASK_DEFS
        run: terraform validate
  
      - name: Terraform Plan
        working-directory: TerraFormConfig/TASK_DEFS
        run: terraform plan -var-file=images.tfvars -out=tfplan
  
      - name: Terraform Apply
        working-directory: TerraFormConfig/TASK_DEFS
        run: terraform apply -auto-approve tfplan

  deploy_ecs_services:
      name: Desplegar servicios ECS
      needs: deploy_task_def        
      runs-on: ubuntu-latest
  
      defaults:
        run:
          working-directory: TerraFormConfig/ECS_SERVICE
  
      steps:
        - name: Checkout repo
          uses: actions/checkout@v4
  
        - name: Configure AWS credentials
          uses: aws-actions/configure-aws-credentials@v2
          with:
            aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
            aws-region:            ${{ secrets.AWS_REGION }}
  
        - name: Setup Terraform
          uses: hashicorp/setup-terraform@v3
          with:
            terraform_version: 1.6.5          
  
        - name: Terraform Init
          run: terraform init
  
        - name: Import existing ECS services if they exist
          run: |
            SERVICES=("front-service" "kong-service" "back-service")
            CLUSTERS=("FrontCluster" "KongCluster" "BackCluster")
  
            for i in "${!SERVICES[@]}"; do
              SVC_NAME=${SERVICES[$i]}
              CLS_NAME=${CLUSTERS[$i]}
  
              SVC_ARN=$(aws ecs describe-services \
                          --cluster "$CLS_NAME" \
                          --services "$SVC_NAME" \
                          --query 'services[0].serviceArn' \
                          --output text 2>/dev/null || true)
  
              if [[ -n "$SVC_ARN" && "$SVC_ARN" != "None" ]]; then
                echo "Importando $SVC_NAME ($SVC_ARN)"
                terraform import "module.${SVC_NAME//-/_}.aws_ecs_service.this" "$SVC_ARN" || true
              else
                echo "El servicio $SVC_NAME no existe; Terraform lo creará."
              fi
            done
  
        - name: Terraform Validate
          run: terraform validate
  
        - name: Terraform Plan
          run: terraform plan -out=tfplan
  
        - name: Terraform Apply
          run: terraform apply -auto-approve tfplan
